# Nginx config para Dashboard + Auth Server
# Copiar a: /etc/nginx/sites-available/dashboard
# Luego: ln -s /etc/nginx/sites-available/dashboard /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name dash.api.azke.tech;  # CAMBIAR

    # Redirigir a HTTPS (descomentar cuando tengas SSL)
    # return 301 https://$server_name$request_uri;

    # Dashboard (archivos estáticos del build)
    root /var/www/dashboard/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Auth Server (PM2)
    location /api/auth {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin token endpoint
    location /api/admin-token {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webradio API (Docker en puerto 5000)
    location ~ ^/(api|search|stream|admin) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Para streaming
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

