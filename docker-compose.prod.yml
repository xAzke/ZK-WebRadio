version: "3.8"

# Production Docker Compose - Solo Webradio API
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
    # Webradio API (.NET)
    webradio:
        image: ${DOCKER_REGISTRY-}webradio
        container_name: webradio
        build:
            context: .
            dockerfile: webradio/Dockerfile
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            - ASPNETCORE_URLS=http://+:5000
            - DatabaseProvider=${DatabaseProvider}
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_NAME=${DB_NAME}
            - DB_USER=${DB_USER}
            - DB_PASS=${DB_PASS}
            - SupabaseUrl=${SupabaseUrl}
            - Dashboard__Url=${Dashboard__Url}
            - Redis__Configuration=${Redis__Configuration}
            - Services__Deezer=${Services__Deezer}
            - ApplicationOptions__EncryptionKey=${ApplicationOptions__EncryptionKey}
            - CorsOrigins=${CorsOrigins}
        ports:
            - "5000:5000"
        volumes:
            - deezer-cache:/tmp/deezer-cache
            - ./data:/app/data
        networks:
            - webradio
        restart: unless-stopped

    # Deezer Service (requerido por webradio)
    deezer:
        image: ${DOCKER_REGISTRY-}deezerservice
        container_name: deezer
        build:
            context: .
            dockerfile: deezer-service/Dockerfile
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            - ASPNETCORE_URLS=http://+:5002
            - Arl=${Arl}
            - CacheDirectory=${CacheDirectory}
            - CacheMaxFiles=${CacheMaxFiles}
            - CacheMaxSizeMB=${CacheMaxSizeMB}
            - CacheCleanupIntervalMinutes=${CacheCleanupIntervalMinutes}
        volumes:
            - deezer-cache:/tmp/deezer-cache
        networks:
            - webradio
        restart: unless-stopped

    # Redis (para cache)
    redis:
        image: redis:alpine
        container_name: redis
        volumes:
            - redis-data:/data
        networks:
            - webradio
        restart: unless-stopped

volumes:
    redis-data:
    deezer-cache:

networks:
    webradio:
        driver: bridge
